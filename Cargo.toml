[package]
name = "sshpro"
version = "0.2.0"
edition = "2021"
description = "SSH Pro AI desktop app (Rust): many SSH servers in one window, with an AI ops assistant"
license = "MIT"
build = "build.rs"

[[bin]]
name = "sshpro"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fancy-regex = "0.20"
flate2 = "1"
futures = "0.3"
indexmap = "2"
mime_guess = "2"
rand = "0.9"
regex = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "4"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.18", default-features = false }
tao = "0.37"
wry = "0.57"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory",
    "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Console",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
